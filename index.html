<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lekesafari – Kart over lekeplasser i Norge</title>
  <meta name="description" content="Lekesafari – oppdag lekeplasser i Norge med kart, rating, bilder, filter og informasjon om fasiliteter.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://images.unsplash.com">
  <style>
    /* Leaflet container must be absolute positioned */
    .map-wrap { position: relative; height: calc(100vh - 60px); }
    #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🧭</span>
      <div>
        <h1>Lekesafari</h1>
        <p class="tagline">Oppdag lekeplasser i Norge</p>
      </div>
    </div>
    <button id="locate-btn" class="icon-btn" title="Gå til min lokasjon" aria-label="Gå til min lokasjon">
      📍
    </button>
  </header>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="search-block">
        <input id="search-input" type="text" placeholder="Søk navn, by, apparat…" autocomplete="off" aria-label="Søk lekeplasser">
        <button id="search-clear" class="clear-btn" title="Tøm søk" aria-label="Tøm søk">×</button>
      </div>

      <div class="filter-group">
        <h2>Filter</h2>

        <label class="filter-row">
          <input type="checkbox" id="filter-fenced">
          <span>Inngjerdet</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="filter-toilets">
          <span>Toalett</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="filter-free-parking">
          <span>Gratis parkering</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="filter-paid-parking">
          <span>Betalt parkering</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="filter-dogs-allowed">
          <span>Hunder tillatt</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="filter-dogs-leash">
          <span>Hunder på skrud</span>
        </label>

        <div class="age-filter">
          <label>Alikn. alder: 
            <input type="number" id="filter-age-min" min="0" max="18" value="0" style="width:50px;">
            <span>–</span>
            <input type="number" id="filter-age-max" min="0" max="18" value="18" style="width:50px;">
          </label>
        </div>

        <label class="filter-row">
          <select id="filter-equipment">
            <option value="">Apparat</option>
            <option value="Rutschbane">Rutschbane</option>
            <option value="Vippe">Vippe</option>
            <option value="Gynge">Gynge</option>
            <option value="Hoppeslott">Hoppeslott</option>
            <option value="Sandkasse">Sandkasse</option>
            <option value="Klatrestativ">Klatrestativ</option>
            <option value="Labyrint">Labyrint</option>
            <option value="Trosse">Trosse</option>
            <option value="Karussell">Karussell</option>
            <option value="Ballbane">Ballbane</option>
            <option value="Sikringshus">Sikringshus</option>
            <option value="Vannleke">Vannleke</option>
            <option value="Trampolin">Trampolin</option>
          </select>
        </label>

        <label class="filter-row">
          <input type="range" id="filter-rating" min="0" max="5" step="0.5" value="0">
          <span>Rating: min <span id="rating-value">0</span>★</span>
        </label>

        <label class="filter-row">
          <select id="filter-source">
            <option value="alle">Alle kilder</option>
            <option value="osm">OSM</option>
            <option value="geonorge">Geonorge</option>
            <option value="municipality">Kommune</option>
            <option value="user">Bruker</option>
          </select>
        </label>
      </div>

      <div class="results-section">
        <h2>Resultater (<span id="result-count">0</span>)</h2>
        <div id="playground-list" class="playground-list"></div>
      </div>
    </aside>

    <div class="map-wrap">
      <div id="map"></div>
    </div>
  </div>

  <div id="detail-modal" class="detail-modal" style="display: none;">
    <div class="detail-card">
      <button id="detail-close" class="detail-close" aria-label="Lukk">×</button>
      <div id="detail-content" class="detail-content"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Load Leaflet first, then seed data, sources (data loading), then app -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="seed-data.js?v=2"></script>
  <script src="sources.js?v=2"></script>
  <script src="app-leaflet.js?v=2"></script>
</body>
</html>
