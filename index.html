<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lekesafari – Kart over lekeplasser i Norge</title>
  <meta name="description" content="Lekesafari – oppdag lekeplasser i Norge med kart, rating, bilder, filter og informasjon om fasiliteter.">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://images.unsplash.com">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🧭</span>
      <div>
        <h1>Lekesafari</h1>
        <p class="tagline">Oppdag lekeplasser i Norge</p>
      </div>
    </div>
    <button id="locate-btn" class="icon-btn" title="Gå til min lokasjon" aria-label="Gå til min lokasjon">
      📍
    </button>
  </header>

  <div class="app-shell">
    <!-- Sidebar / filter panel -->
    <aside class="sidebar" id="sidebar">
      <div class="search-block">
        <input id="search-input" type="text" placeholder="Søk navn, by, apparat…" autocomplete="off" aria-label="Søk lekeplasser">
        <button id="search-clear" class="clear-btn" title="Tøm søk" aria-label="Tøm søk">×</button>
      </div>

      <div class="filter-group">
        <h2>Filter</h2>

        <label class="filter-row">
          <input type="checkbox" id="filter-fenced">
          <span>Inngjerdet</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="filter-toilets">
          <span>Toalett</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="filter-free-parking">
          <span>Gratis parkering</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="filter-paid-parking">
          <span>Betalt parkering</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="filter-dogs-allowed">
          <span>Hund tillatt</span>
        </label>
        <label class="filter-row">
          <input type="checkbox" id="filter-dogs-leash">
          <span>Hund i bånd</span>
        </label>

        <div class="filter-field">
          <label for="filter-age">Aldersgruppe</label>
          <div class="age-row">
            <select id="filter-age-min">
              <option value="0">0+</option>
              <option value="2">2+</option>
              <option value="4">4+</option>
              <option value="6">6+</option>
              <option value="10">10+</option>
              <option value="12">12+</option>
              <option value="18">18+</option>
            </select>
            <span class="dash">–</span>
            <select id="filter-age-max">
              <option value="2">2+</option>
              <option value="4">4+</option>
              <option value="6">6+</option>
              <option value="8">8+</option>
              <option value="10">10+</option>
              <option value="12">12+</option>
              <option value="18">18+</option>
            </select>
          </div>
        </div>

        <div class="filter-field">
          <label for="filter-equipment">Apparater (inkluder)</label>
          <select id="filter-equipment" multiple size="5">
            <option value="rutschebane">Rutschbane</option>
            <option value="gynge">Gynge</option>
            <option value="klatrestativ">Klatrestativ</option>
            <option value="gattrett">Gåtte</option>
            <option value="hoppeslott">Hoppeslott</option>
            <option value="sandkasse">Sandkasse</option>
            <option value="karussell">Karussell</option>
            <option value=" basketball">Basketball</option>
            <option value="vippe">Vippe</option>
            <option value="trapeq">Trapeq</option>
          </select>
          <small>Hold Ctrl/Cmd for flere</small>
        </div>

        <div class="filter-field">
          <label for="filter-rating">Minimum rating</label>
          <select id="filter-rating">
            <option value="0">Ingen rating</option>
            <option value="2">2+ stjerner</option>
            <option value="3">3+ stjerner</option>
            <option value="4">4+ stjerner</option>
          </select>
        </div>

        <div class="filter-field">
          <label for="filter-source">Data-kilde</label>
          <select id="filter-source">
            <option value="alle">Alle kilder</option>
            <option value="osm">OpenStreetMap</option>
            <option value="geonorge">Kartverket/Geonorge</option>
            <option value="user">Brukerrapporterte</option>
            <option value="municipality">Kommunale data</option>
          </select>
        </div>
      </div>

      <div class="result-bar">
        <span id="result-count">Laster…</span>
      </div>

      <div class="playground-list" id="playground-list"></div>
    </aside>

    <!-- Map -->
    <main class="map-wrap">
      <div id="map"></div>
      <div class="map-attribution">
        <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a> ·
        <a href="https://maplibre.org" target="_blank" rel="noopener">MapLibre</a> ·
        <a href="https://github.com/turbolego/Lekesafari" target="_blank" rel="noopener">Lekesafari</a>
      </div>
    </main>
  </div>

  <!-- Detail modal -->
  <div class="modal-overlay" id="detail-modal" hidden>
    <div class="modal-card detail-card">
      <button class="modal-close" id="detail-close" aria-label="Lukk">×</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="sources.js"></script>
  <script src="app.v2.js"></script>
</body>
</html>
