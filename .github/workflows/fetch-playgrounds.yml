name: fetch-playgrounds

on:
  schedule:
    - cron: '0 3 * * *'  # Runs at 3:00 AM UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geojson

      - name: Fetch playgrounds from OSM
        run: |
          python tools/fetch_playgrounds.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/playgrounds_all.geojson || true
          if git diff --cached --quiet; then
            echo "No playground data changes — nothing to commit."
            exit 0
          fi
          git commit -m "Update all playgrounds data"
          git push "https://x-access-token:*** secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"

      - name: Generate statistics
        run: |
          python tools/generate_statistics.py

      - name: Commit statistics
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          if [ ! -f data/playground_stats.json ]; then
            echo "playground_stats.json not generated — skipping stats commit."
            exit 0
          fi
          git add data/playground_stats.json
          if git diff --cached --quiet; then
            echo "No statistics changes — nothing to commit."
            exit 0
          fi
          git commit -m "Update playground statistics"
          git push "https://x-access-token:*** secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "HEAD:${{ github.ref_name }}"