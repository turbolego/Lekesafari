name: fetch-playgrounds

on:
  schedule:
    - cron: '0 3 * * *'  # Runs at 3:00 AM UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests geojson

      - name: Fetch playgrounds from OSM
        run: |
          python tools/fetch_playgrounds.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add data/playgrounds_all.geojson
          git commit -m "Update all playgrounds data"
          git push

      - name: Generate statistics
        run: |
          python tools/generate_statistics.py

      - name: Commit statistics
        run: |
          git add data/playground_stats.json
          git commit -m "Update playground statistics"
          git push