# Lekesafari CI — e2e tests for the Geonorge WMS marker pipeline.
#
# Triggered on push to main, and can be run manually. Runs Playwright e2e
# tests against the deployed pages to verify:
#   - WMS (Geonorge Tilgjengelighet3) markers render correctly
#   - Marker popups carry emoji info + details
#   - Filter controls (filter-poi-type) narrow results correctly
#   - No uncaught JS errors during WMS marker loading
#
# The static dataset (data/playgrounds_all.geojson) and deployed pages
# are served on a local HTTP server, exactly like GitHub Pages.

name: e2e

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium

      - name: Serve deployed files
        run: |
          cd e2e
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .. &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 2

      - name: Run Playwright e2e tests
        run: |
          cd e2e
          npx playwright test --reporter=dot
        env:
          CHROME_PATH: /usr/bin/chromium-browser

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Check generated artifact
        if: always()
        run: |
          echo "Server PID: $SERVER_PID"
          kill $SERVER_PID 2>/dev/null || true
